<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Offline · NarcoTrace</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #e8e6df; font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 420px; border: 1px solid #e8e6df; }
  .head { display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-bottom: 1px solid #e8e6df; font-weight: 600; }
  .body { padding: 22px 20px; }
  .label { font: 10.5px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #7d7b74; }
  h1 { font-size: 24px; line-height: 1.2; font-weight: 500; margin: 8px 0 12px; letter-spacing: -.02em; }
  p { color: #b4b2aa; margin: 0 0 12px; }
  a { color: #e8e6df; }
  .red { color: #ff3b26; font-weight: 600; }
  button { margin-top: 8px; background: none; color: #e8e6df; border: 1px solid #e8e6df; padding: 10px 16px; font: 10.5px ui-monospace, monospace;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #e8e6df; color: #0a0a0a; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="head"><img src="/icons/favicon-32.png" width="20" height="20" alt="">NarcoTrace</div>
    <div class="body">
      <div class="label">No connection</div>
      <h1>You are offline.</h1>
      <p>Public pages you opened recently still work. The enforcement view is never stored on this device, so it needs a connection.</p>
      <p>In an emergency, call <a class="red" href="tel:112">112</a>. De-addiction helpline: <a href="tel:14446">14446</a>.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </div>
</main>
</body>
</html>
